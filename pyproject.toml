[project]
name = "navigator"
version = "0.1.0"
description = "Staged ETL pipeline for NYC 311 service requests."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
navigator = "navigator.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Puts the project root on sys.path. Without it `pytest` only works when invoked
# as `python -m pytest`, which happens to add the working directory itself — so
# the suite passes for whoever wrote it and fails for everyone who follows the
# README.
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
