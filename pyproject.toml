[project]
name = "navigator"
version = "0.1.0"
description = "Staged ETL pipeline for NYC 311 service requests."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
navigator = "navigator.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
